<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lordverso · Criador de personagens</title>
<style>
/* ===== CORES DO SITE (mude aqui) ===== */
:root{--bg:#fff3e6;--card:#fffaf4;--ink:#2a1512;--mut:#8a6a5e;--acc:#e0301e;--line:#e8d3c2;--tb:#fff8f0;--hh:0px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1311;--card:#2a1c19;--ink:#f6e7dc;--mut:#b9998c;--line:#4a3029}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Trebuchet MS',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
#app{max-width:1000px;margin:0 auto}

/* ===== TOPO: título, botões e o boneco ===== */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:8px 12px 6px;display:flex;flex-direction:column;align-items:center;gap:8px}
#bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px}
@media (max-width:420px){h1{font-size:.9rem;letter-spacing:.04em}.acts{gap:4px}.ib{padding:0 8px}}
h1{font-size:1.05rem;margin:0;letter-spacing:.08em;text-transform:uppercase}
.acts{display:flex;gap:6px}
.ib{height:38px;min-width:38px;padding:0 10px;white-space:nowrap;border:2px solid var(--ink);border-radius:10px;background:var(--card);font-weight:700;transition:transform .12s}
.ib:active{transform:scale(.92)}.ib[disabled]{opacity:.35;cursor:default}
.ib.go{background:var(--acc);color:#fff}

/* palco: 720x900 = mesma proporção das peças (1080x1350).
   A LARGURA manda (no máximo 80% da altura --sh) e a altura vem da proporção,
   assim o boneco nunca fica achatado quando a janela é estreita. */
#stage{position:relative;--sh:min(38vh,400px);width:min(100%,calc(var(--sh)*.8));aspect-ratio:720/900;border:3px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff;
 background-image:conic-gradient(#ddd 25%,#fff 0 50%,#ddd 0 75%,#fff 0);background-size:16px 16px}
#stage>*{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stage.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
.m{-webkit-mask-size:100% 100%;mask-size:100% 100%}   /* camada de pintura (tingida pela máscara) */

/* ===== ABAS ===== */
#tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:9;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:6px 12px 8px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:.68rem;transition:transform .12s}
.tab:active{transform:scale(.94)}
.tab.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tab .ic{width:40px;height:40px;border-radius:9px;background:var(--tb);display:grid;place-items:center;overflow:hidden;font-size:1.3rem}
.tab .ic img{width:100%;height:100%;object-fit:contain}
.tab .ic i{width:26px;height:26px;border-radius:50%;border:2px solid #2a1512}

/* ===== PAINEL: cores e opções ===== */
#panel{padding:4px 12px 40px}
.lab{font-size:.74rem;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:8px 0 6px}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);transition:transform .12s;position:relative}
.sw:active{transform:scale(.9)}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--acc);transform:scale(1.08)}
.sw.none{background:linear-gradient(135deg,#fff 45%,#e0301e 45% 55%,#fff 55%)}
.sw.pick{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.sw.pick input{position:absolute;inset:-6px;width:60px;height:60px;opacity:0;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.opt{aspect-ratio:1;background:var(--tb);border:2px solid var(--line);border-radius:14px;padding:3px;display:grid;place-items:center;position:relative;transition:transform .12s,border-color .12s;color:#2a1512}
.opt img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.opt:hover{transform:translateY(-2px);border-color:var(--mut)}
.opt:active{transform:scale(.93)}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.opt.on::after{content:"✓";position:absolute;top:3px;right:5px;width:18px;height:18px;border-radius:50%;background:var(--acc);color:#fff;font-size:.7rem;display:grid;place-items:center}
.opt span{font-size:.7rem;position:absolute;bottom:2px;left:0;right:0;text-align:center;background:linear-gradient(transparent,var(--tb) 60%);padding-top:8px;border-radius:0 0 10px 10px}
.opt .x{font-size:1.8rem;opacity:.5;position:static;background:none;padding:0}
.hint{font-size:.76rem;color:var(--mut);margin-top:14px}

/* computador: boneco à esquerda, opções à direita */
@media (min-width:860px){
 #app{display:grid;grid-template-columns:minmax(380px,44%) 1fr;column-gap:8px;align-items:start;align-content:start;grid-template-rows:auto 1fr;padding-top:8px}
 #top{grid-row:1/3;top:calc(env(safe-area-inset-top,0px) + 8px)}
 #stage{--sh:min(78vh,680px)}
 #tabs{top:auto;position:static;flex-wrap:wrap;overflow:visible;padding-top:12px}
 .tab{width:76px}
}

/* ===== CARTA DO PERSONAGEM (story) ===== */
#cartaBtn{width:100%;max-width:420px;height:40px;border:2px solid var(--ink);border-radius:12px;background:var(--acc);color:#fff;font-weight:800;letter-spacing:.03em}
#cartaBtn:active{transform:scale(.97)}
#ov{position:fixed;inset:0;z-index:50;background:rgba(20,10,8,.72);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#ov.on{display:flex}
#box{width:100%;max-width:440px;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
#box h2{margin:0;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
#box h2 button{font-size:1.3rem;line-height:1;padding:4px 8px}
#box label{font-size:.74rem;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;display:flex;flex-direction:column;gap:4px}
#box input{font:inherit;font-size:1rem;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
#box input:focus{outline:none;border-color:var(--acc)}
#cv{width:min(100%,260px);aspect-ratio:1080/1920;align-self:center;border:2px solid var(--ink);border-radius:10px;background:#1c1311}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .ib{flex:1;min-width:130px}
#seg{display:block;text-align:center;text-decoration:none;color:var(--ink);padding:10px;border:2px dashed var(--acc);border-radius:12px;font-size:.86rem;line-height:1.35}
#seg b{color:var(--acc)}
#msg{font-size:.82rem;color:var(--mut);text-align:center;min-height:1.1em;margin:0}
</style></head><body>
<div id="app">
 <header id="top">
  <div id="bar"><h1>Lordverso</h1>
   <div class="acts">
    <button class="ib" id="un" aria-label="Desfazer">↶</button>
    <button class="ib" id="re" aria-label="Refazer">↷</button>
    <button class="ib" id="rnd" aria-label="Aleatório">🎲</button>
    <button class="ib" id="rst" aria-label="Recomeçar">⟲</button>
    <button class="ib go" id="dl">⬇ PNG</button>
   </div></div>
  <div id="stage"></div>
  <button id="cartaBtn">🃏 Montar minha carta</button>
 </header>
 <nav id="tabs"></nav>
 <main id="panel"></main>
</div>

<div id="ov" role="dialog" aria-modal="true" aria-label="Membro oficial do Lordverso">
 <div id="box">
  <h2>Sua carta <button id="fecha" aria-label="Fechar">✕</button></h2>
  <label>Nome do personagem<input id="cNome" maxlength="22" placeholder="Ex.: Lua" autocomplete="off"></label>
  <label>Seu @ no Instagram (opcional)<input id="cUser" maxlength="30" placeholder="@seuperfil" autocomplete="off" autocapitalize="none"></label>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div class="row">
   <button class="ib go" id="cBaixar">⬇ Baixar carta</button>
   <button class="ib" id="cShare" hidden>📲 Compartilhar</button>
  </div>
  <p id="msg"></p>
  <a id="seg" href="https://www.instagram.com/lordverso_oficial/" target="_blank" rel="noopener">Postou no story? <b>Marque @lordverso_oficial</b> para eu ver o seu personagem. Toque aqui para seguir.</a>
 </div>
</div>

<script>
/* =====================================================================
   DADOS — gerados pelo build.py (não edite à mão)
   D[categoria][peça] = { name, line, fills:[[máscara, papel]], thumb, back, defs, cnames }
   (defs/cnames: só roupas — cor original e nome de cada pintura k0, k1...)
   ===================================================================== */
const D=/*DADOS*/{};

/* ===== PALETAS (as 1ªs cores de cada lista são as da sua pintura) ===== */
const PAL={
 skin:['#ffcba2','#f8dcc4','#efc09a','#d9a074','#b97a50','#8a5636','#5e3a24','#f4b9b9','#d8d2cc'],
 iris:['#fd1443','#3b2a22','#2f6fd0','#2e9a5a','#8a3fd0','#e0a020','#222222','#7ad0e0'],
 hcol:['#6b75ff','#5a2d22','#1e1a1a','#e9d8a6','#d94a3a','#3a8fe0','#8a4fd0','#e86aa0','#f2f2ee'],
 lip:['#fd1443','#e0505a','#b0203a','#f08aa0','#7a3a9a','#d97a30','#4a1a2a'],
 cloth:['#ff0000','#ff0055','#f7a8c4','#ffba42','#ffff00','#00ffaa','#2e9a5a','#0055ff','#0079b6','#8a3fd0','#ffffff','#9a9a9a','#414141','#000000'],
 gcol:['#0055ff','#ff0055','#414141','#f7a8c4','#ffba42','#2e9a5a','#8a3fd0','#ffffff','#ff0000'],
 bg:['#ff2a2a','#ffe99a','#f7a8c4','#a8d8f0','#bfa8e8','#9ad0a0','#ff9a3c','#2a2a2a','transparent']};

/* cada COR de uma roupa tem seu próprio seletor: k0, k1, k2... (mesma paleta) */
for(let i=0;i<6;i++)PAL['k'+i]=PAL.cloth;

/* sombra da pele = pele × este fator (tirado da sua pintura: #ffcba2 → #bc774c) */
const SOMBRA=[0.737,0.586,0.469];

/* Abas: [categoria, nome, emoji, paleta de cor, rótulo da cor] */
const G=[['head','Cabeça','🙂','skin','Cor da pele'],
 ['hair','Cabelo','💇','hcol','Cor do cabelo'],
 ['ears','Orelhas','👂','skin','Cor da pele'],
 ['extras','Chifres e orelhas','😈',null],
 ['eyes','Olhos','👁️','iris','Cor dos olhos'],
 ['brows','Sobrancelhas','🤨','hcol','Cor (igual à do cabelo)'],
 ['nose','Nariz','👃',null],
 ['mouth','Boca','👄','lip','Cor dos lábios'],
 ['acc','Acessórios','👓',null],
 ['clothes','Roupa','👕',null],
 ['hands','Mãos juntas','🤟','skin','Cor da pele'],
 ['handL','Mão esquerda','🫲','skin','Cor da pele'],
 ['handR','Mão direita','🫱','skin','Cor da pele'],
 ['bg','Fundo','🖼️','bg','Cor do fundo']].filter(g=>g[0]==='bg'||(g[0]==='acc'?(D.glasses||D.pierc):D[g[0]]));

/* Ordem das camadas, de baixo pra cima (igual ao build.py) */
const ORDEM=['hairBack','ears','hairMid','head','clothes','hair','extras','handL','handR','hands','eyes','brows','nose','mouth','glasses','pierc'];

const first=c=>D[c]?Object.keys(D[c]).find(k=>k!=='nenhuma'):null;
const DEF={head:first('head'),eyes:first('eyes'),brows:first('brows')||'nenhuma',nose:first('nose')||'nenhuma',mouth:first('mouth')||'nenhuma',
 hair:first('hair')||'nenhuma',ears:'nenhuma',clothes:'nenhuma',extras:'nenhuma',handL:'nenhuma',handR:'nenhuma',hands:'nenhuma',glasses:'nenhuma',pierc:[],gcol:PAL.gcol[0],
 k0:'#ffffff',k1:'#ffffff',k2:'#ffffff',k3:'#ffffff',k4:'#ffffff',k5:'#ffffff',
 skin:PAL.skin[0],iris:PAL.iris[0],hcol:PAL.hcol[0],lip:PAL.lip[0],bg:PAL.bg[0]};
const KEY='lv2';   // (o protótipo antigo usava 'lv' — outra estrutura)
let S={...DEF},tab=G[0][0],hist=[],fut=[];
try{const t=JSON.parse(localStorage.getItem(KEY)||'null');
 const m=t&&{...DEF,...t};   /* personagem salvo antes da aba Roupa: completa com o padrão */
 const ok=m&&G.every(g=>g[0]==='bg'||(g[0]==='acc'?(!D.glasses||D.glasses[m.glasses])&&Array.isArray(m.pierc)&&m.pierc.every(k=>D.pierc&&D.pierc[k]):D[g[0]][m[g[0]]]));
 if(ok)S=m}catch(e){}

/* papel da pintura -> cor atual */
function sombra(hex){const n=parseInt(hex.slice(1),16);
 const c=[n>>16&255,n>>8&255,n&255].map((v,i)=>Math.round(v*SOMBRA[i]));
 return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
function cor(papel){
 if(papel[0]==='#')return papel;               // cor fixa (ex.: branco do olho)
 if(papel==='skin')return S.skin;
 if(papel==='shade')return sombra(S.skin);
 if(papel==='iris')return S.iris;
 if(papel==='lip')return S.lip;
 if(papel==='hair')return S.hcol;
 if(papel==='glass')return S.gcol;
 if(/^k\d$/.test(papel))return S[papel];      // cor de roupa (k0, k1...)
 return '#f0f'}                                 // papel desconhecido: rosa berrante pra você notar


/* ===== Fundos de bandeiras LGBTQIA+ =====
   s = listras de cima pra baixo [cor, peso]; o = detalhe extra: 'tri' triângulo preto (demi),
   'prog' triângulo em camadas do Progresso, 'ring' círculo roxo (intersexo), 'pi' π dourado (poliamor).
   S.bg guarda 'flag:<id>'. Cores conferidas em Wikipedia/Pantone e em páginas de códigos de cor de bandeiras. */
const FLAGS=[
 {id:'orgulho',n:'Orgulho LGBT (arco-íris)',s:[['#E40303'],['#FF8C00'],['#FFED00'],['#008026'],['#004DFF'],['#750787']]},
 {id:'progresso',n:'Progresso (Progress Pride)',s:[['#E40303'],['#FF8C00'],['#FFED00'],['#008026'],['#004DFF'],['#750787']],o:'prog',c:['#000000','#784F17','#74D7EE','#FFAFC8','#FFFFFF']},
 {id:'filadelfia',n:'Filadélfia (inclusiva)',s:[['#000000'],['#784F17'],['#D12229'],['#F68A1E'],['#FDE01A'],['#007940'],['#24408E'],['#732982']]},
 {id:'gay',n:'Gay (homens gays)',s:[['#078D70'],['#26CEAA'],['#98E8C1'],['#FFFFFF'],['#7BADE2'],['#5049CC'],['#3D1A78']]},
 {id:'lesbica',n:'Lésbica',s:[['#D52D00'],['#FF9A56'],['#FFFFFF'],['#D362A4'],['#A30262']]},
 {id:'bissexual',n:'Bissexual',s:[['#D60270',2],['#9B4F96',1],['#0038A8',2]]},
 {id:'pansexual',n:'Pansexual',s:[['#FF218C'],['#FFD800'],['#21B1FF']]},
 {id:'polissexual',n:'Polissexual',s:[['#F61CB9'],['#07D569'],['#1C92F6']]},
 {id:'onissexual',n:'Onissexual',s:[['#FE9ACE'],['#FF53BF'],['#200044'],['#6760FE'],['#8EA6FF']]},
 {id:'assexual',n:'Assexual',s:[['#000000'],['#A3A3A3'],['#FFFFFF'],['#800080']]},
 {id:'demissexual',n:'Demissexual',s:[['#FFFFFF',3],['#800080',1],['#A3A3A3',3]],o:'tri'},
 {id:'cinzassexual',n:'Cinzassexual (graysexual)',s:[['#740194'],['#AEB1B7'],['#FFFFFF'],['#AEB1B7'],['#740194']]},
 {id:'aromantica',n:'Aromântica',s:[['#3DA542'],['#A7D379'],['#FFFFFF'],['#A9A9A9'],['#000000']]},
 {id:'trans',n:'Transgênero',s:[['#5BCEFA'],['#F5A9B8'],['#FFFFFF'],['#F5A9B8'],['#5BCEFA']]},
 {id:'naobinario',n:'Não-binário',s:[['#FCF434'],['#FFFFFF'],['#9C59D1'],['#2C2C2C']]},
 {id:'genderfluid',n:'Gênero fluido (genderfluid)',s:[['#FF75A2'],['#FFFFFF'],['#BE18D6'],['#000000'],['#333EBD']]},
 {id:'genderqueer',n:'Genderqueer',s:[['#B57EDC'],['#FFFFFF'],['#4A8123']]},
 {id:'agenero',n:'Agênero',s:[['#000000'],['#BCC4C7'],['#FFFFFF'],['#B7F684'],['#FFFFFF'],['#BCC4C7'],['#000000']]},
 {id:'bigenero',n:'Bigênero',s:[['#C479A2'],['#EDA5CD'],['#D6C7E8'],['#FFFFFF'],['#D6C7E8'],['#9AC7E8'],['#6D82D1']]},
 {id:'demigarota',n:'Demigarota (demigirl)',s:[['#7F7F7F'],['#C4C4C4'],['#FDADC8'],['#FFFFFF'],['#FDADC8'],['#C4C4C4'],['#7F7F7F']]},
 {id:'demigaroto',n:'Demigaroto (demiboy)',s:[['#7F7F7F'],['#C4C4C4'],['#9DD7EA'],['#FFFFFF'],['#9DD7EA'],['#C4C4C4'],['#7F7F7F']]},
 {id:'intersexo',n:'Intersexo',s:[['#FFD800']],o:'ring'},
 {id:'poliamor',n:'Poliamor',s:[['#0000FF'],['#FF0000'],['#000000']],o:'pi'}
];
const flagOf=v=>typeof v==='string'&&v.startsWith('flag:')?FLAGS.find(f=>f.id===v.slice(5)):null;
function drawFlag(x,f,X,Y,W,H){
 const tot=f.s.reduce((a,s)=>a+(s[1]||1),0);let y=Y;
 f.s.forEach(s=>{const h=H*(s[1]||1)/tot;x.fillStyle=s[0];x.fillRect(X,Math.floor(y),W,Math.ceil(h)+1);y+=h});
 const m=Math.min(W,H);
 if(f.o==='tri'){x.fillStyle='#000';x.beginPath();x.moveTo(X,Y);x.lineTo(X+W*.5,Y+H/2);x.lineTo(X,Y+H);x.closePath();x.fill()}
 else if(f.o==='prog'){
  const x0=W*.5,sl=(H/2)/x0,st=W*.075;
  f.c.forEach((c,i)=>{x.fillStyle=c;x.beginPath();x.moveTo(X,Y+sl*i*st);x.lineTo(X+x0-i*st,Y+H/2);x.lineTo(X,Y+H-sl*i*st);x.closePath();x.fill()})}
 else if(f.o==='ring'){x.strokeStyle='#7902AA';x.lineWidth=W*.07;x.beginPath();x.arc(X+W/2,Y+H*.4,W*.44,0,Math.PI*2);x.stroke()}
 else if(f.o==='pi'){x.fillStyle='#FFD700';x.textAlign='center';x.textBaseline='middle';x.font=`bold ${H*.22}px Georgia,'Times New Roman',serif`;x.fillText('π',X+W*.17,Y+H*.14)}
}
const FURL={};
function flagURL(f){if(!FURL[f.id]){const c=document.createElement('canvas');c.width=160;c.height=200;drawFlag(c.getContext('2d'),f,0,0,160,200);FURL[f.id]=c.toDataURL('image/png')}return FURL[f.id]}
function flagsPanel(p){
 const l=document.createElement('div');l.className='lab';l.textContent='Bandeiras';p.appendChild(l);
 const gr=document.createElement('div');gr.className='grid';
 FLAGS.forEach(f=>{const on=S.bg==='flag:'+f.id;const b=document.createElement('button');b.className='opt'+(on?' on':'');
  b.setAttribute('aria-label',f.n);b.setAttribute('aria-pressed',on);
  b.innerHTML=`<img alt="" src="${flagURL(f)}" style="width:100%;height:100%;object-fit:cover;border-radius:10px"><span>${f.n}</span>`;
  b.onclick=()=>set('bg','flag:'+f.id);gr.appendChild(b)});
 p.appendChild(gr);
}

/* lista de camadas: ['c',cor] fundo | ['m',máscara,cor] pintura | ['l',linha] contorno */
function layers(){
 const o=[['c',S.bg]];
 for(const cat of ORDEM){
  if(cat==='hairBack'){const h=D.hair&&D.hair[S.hair];if(h&&h.back)o.push(['m',h.back,S.hcol]);continue}
  if(cat==='hairMid'){const h=D.hair&&D.hair[S.hair];const v=h&&h.porCabeca&&h.porCabeca[S.head];const md=v?v.mid:(h&&h.mid);if(md)o.push(['m',md,S.hcol]);continue}   /* tampa a fresta entre cabelo e cabeça, por cima da orelha */
  const ks=cat==='pierc'?(S.pierc||[]):[S[cat]];   /* piercing: vários ao mesmo tempo */
  for(const k of ks){const p=D[cat]&&D[cat][k];if(!p)continue;
   p.fills.forEach(f=>o.push(['m',f[0],cor(f[1])]));
   const v=cat==='hair'&&p.porCabeca&&p.porCabeca[S.head];   /* linha do cabelo ajustada ao formato do rosto */
   if(p.line)o.push(['l',v?v.line:p.line]);}
 }
 return o;
}

const IMG={};const img=u=>{if(!IMG[u]){const i=new Image();i.src=u;IMG[u]=i}return IMG[u]};
function render(anim){
 const st=document.getElementById('stage');st.innerHTML='';
 layers().forEach(l=>{let n;
  if(l[0]==='c'){n=document.createElement('div');const fl=flagOf(l[1]);n.style.background=fl?`url(${flagURL(fl)}) center/100% 100%`:(l[1]==='transparent'?'none':l[1]);}
  else if(l[0]==='l'){n=img(l[1]).cloneNode();}
  else{n=document.createElement('div');n.className='m';n.style.background=l[2];n.style.webkitMaskImage=n.style.maskImage=`url(${l[1]})`;}
  st.appendChild(n);});
 if(anim){st.classList.remove('pop');void st.offsetWidth;st.classList.add('pop')}
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 document.getElementById('un').disabled=!hist.length;document.getElementById('re').disabled=!fut.length;
}

/* mudar uma escolha (guarda histórico pro desfazer) */
function set(k,v){if(S[k]===v)return;hist.push({...S});if(hist.length>60)hist.shift();fut=[];S[k]=v;
 if(k==='clothes'){const p=D.clothes[v];(p.fills||[]).filter(f=>f[1][0]==='k').forEach((f,j)=>S[f[1]]=p.defs[j])}   /* cores originais da roupa */
 if(v!=='nenhuma'){if(k==='hands'){S.handL='nenhuma';S.handR='nenhuma'}
  if(k==='handL'||k==='handR')S.hands='nenhuma'}   /* mãos juntas e mãos separadas não ficam juntas */
 render(true);ui()}
function jump(a,b){if(!a.length)return;b.push({...S});S=a.pop();render(true);ui()}
document.getElementById('un').onclick=()=>jump(hist,fut);
document.getElementById('re').onclick=()=>jump(fut,hist);
document.getElementById('rst').onclick=()=>{hist.push({...S});fut=[];S={...DEF};render(true);ui()};

function ui(){tabs();panel()}
function tabs(){
 const t=document.getElementById('tabs');t.innerHTML='';
 G.forEach(([k,n,e])=>{const b=document.createElement('button');b.className='tab'+(k===tab?' on':'');
  const th=(k==='bg'||k==='acc')?null:D[k][S[k]].thumb;
  b.innerHTML=`<span class="ic">${k==='bg'?`<i style="background:${flagOf(S.bg)?'url('+flagURL(flagOf(S.bg))+') center/cover':(S.bg==='transparent'?'#eee':S.bg)}"></i>`:th?`<img alt="" src="${th}">`:e}</span>${n}`;
  b.onclick=()=>{tab=k;ui();document.getElementById('panel').scrollIntoView?.({block:'nearest'})};t.appendChild(b)});

function swatches(p,ck,label){
 const l=document.createElement('div');l.className='lab';l.textContent=label;p.appendChild(l);
 const w=document.createElement('div');w.className='sws';
 PAL[ck].forEach(c=>{const b=document.createElement('button');b.className='sw'+(c==='transparent'?' none':'')+(S[ck]===c?' on':'');if(c!=='transparent')b.style.background=c;b.setAttribute('aria-label',c==='transparent'?'sem fundo':c);b.onclick=()=>set(ck,c);w.appendChild(b)});
 const pk=document.createElement('label');pk.className='sw pick';pk.title='Cor personalizada';
 const inp=document.createElement('input');inp.type='color';inp.value=/^#[0-9a-f]{6}$/i.test(S[ck])?S[ck]:'#ff0000';let old=null;
 inp.onclick=()=>{old={...S}};inp.oninput=()=>{if(!old)old={...S};S[ck]=inp.value;render(false)};
 inp.onchange=()=>{if(old){hist.push(old);fut=[];old=null}render(true);ui()};
 pk.appendChild(inp);w.appendChild(pk);p.appendChild(w);
}
/* a cor de uma aba só aparece se a peça escolhida tem pintura daquele papel */
const ROLE={skin:'skin',iris:'iris',hcol:'hair',lip:'lip'};
function temPapel(cat,ck){const p=D[cat]&&D[cat][S[cat]];return !p||!p.line||ck==='bg'||p.fills.some(f=>f[1]===ROLE[ck])||(cat==='hair'&&p.back)}
/* aba Acessórios: óculos (1 por vez) + piercings (liga/desliga, pode vários) */
function accPanel(p){
 const gp=D.glasses&&D.glasses[S.glasses];
 if(gp&&gp.line)swatches(p,'gcol','Cor da armação');
 const secao=(titulo,fn)=>{const l=document.createElement('div');l.className='lab';l.textContent=titulo;p.appendChild(l);
  const gr=document.createElement('div');gr.className='grid';fn(gr);p.appendChild(gr)};
 const opt=(gr,v,on,click)=>{const b=document.createElement('button');b.className='opt'+(on?' on':'');b.setAttribute('aria-label',v.name);b.setAttribute('aria-pressed',on);
  b.innerHTML=(v.thumb?`<img alt="" src="${v.thumb}">`:`<span class="x">⊘</span>`)+`<span>${v.name}</span>`;b.onclick=click;gr.appendChild(b)};
 if(D.glasses)secao('Óculos',gr=>Object.entries(D.glasses).forEach(([k,v])=>opt(gr,v,S.glasses===k,()=>set('glasses',k))));
 if(D.pierc)secao('Piercings (pode usar vários)',gr=>Object.entries(D.pierc).forEach(([k,v])=>opt(gr,v,(S.pierc||[]).includes(k),()=>togglePierc(k))));
}
function togglePierc(k){hist.push({...S});if(hist.length>60)hist.shift();fut=[];
 const a=S.pierc||[];S.pierc=a.includes(k)?a.filter(x=>x!==k):[...a,k];render(true);ui()}
function panel(){
 const p=document.getElementById('panel');p.innerHTML='';
 const g=G.find(x=>x[0]===tab);
 if(g[3]){
  if(temPapel(tab,g[3]))swatches(p,g[3],g[4]);
  else{const h=document.createElement('div');h.className='hint';h.textContent='Esta peça não tem pintura de '+g[4].toLowerCase()+'.';p.appendChild(h)}
 }
 if(tab==='bg'){flagsPanel(p);return}
 if(tab==='acc'){accPanel(p);return}
 if(tab==='clothes'){
  const rp=D.clothes[S.clothes];
  if(rp&&rp.defs)rp.fills.filter(f=>f[1][0]==='k').forEach((f,j)=>{
   /* a 1ª cor de cada seletor é a cor ORIGINAL daquela parte da roupa */
   PAL[f[1]]=[rp.defs[j],...PAL.cloth.filter(c=>c!==rp.defs[j])];
   swatches(p,f[1],'Cor '+(j+1)+' · '+rp.cnames[j])});
  else if(S.clothes!=='nenhuma'){const h=document.createElement('div');h.className='hint';h.textContent='Esta peça só tem linha, não tem cor pra mudar.';p.appendChild(h)}
 }
 const l=document.createElement('div');l.className='lab';l.textContent=g[1];p.appendChild(l);
 const gr=document.createElement('div');gr.className='grid';
 Object.entries(D[tab]).forEach(([k,v])=>{const b=document.createElement('button');b.className='opt'+(S[tab]===k?' on':'');b.setAttribute('aria-label',v.name);b.setAttribute('aria-pressed',S[tab]===k);
  b.innerHTML=(v.thumb?`<img alt="" src="${v.thumb}">`:`<span class="x">⊘</span>`)+`<span>${v.name}</span>`;b.onclick=()=>set(tab,k);gr.appendChild(b)});
 p.appendChild(gr);

/* ===== ALEATÓRIO ===== */
const R=a=>a[Math.floor(Math.random()*a.length)];
document.getElementById('rnd').onclick=()=>{hist.push({...S});fut=[];
 G.forEach(g=>{const c=g[0];if(c==='bg'||c==='acc'||c==='extras'||c==='handL'||c==='handR')return;S[c]=R(Object.keys(D[c]).filter(k=>k!=='nenhuma'||['brows','hair','hands'].includes(c)))});
 if(D.extras)S.extras=Math.random()<.5?'nenhuma':R(Object.keys(D.extras).filter(k=>k!=='nenhuma'));   /* chifres/orelhas: 50% de chance */
 {const q=Math.random(),pk=c=>R(Object.keys(D[c]).filter(k=>k!=='nenhuma'));   /* mãos: juntas OU separadas, nunca as duas */
  S.hands=S.handL=S.handR='nenhuma';
  if(q>.75)S.hands=pk('hands');else if(q>.4){if(Math.random()<.7)S.handL=pk('handL');if(Math.random()<.7)S.handR=pk('handR')}}
 if(D.glasses)S.glasses=R(Object.keys(D.glasses));            /* às vezes sem óculos */
 if(D.pierc)S.pierc=Object.keys(D.pierc).filter(()=>Math.random()<.25);   /* cada piercing tem 25% de chance */
 S.gcol=R(PAL.gcol);
 const cp=D.clothes&&D.clothes[S.clothes];
 if(cp&&cp.defs){const orig=Math.random()<.5;cp.fills.filter(f=>f[1][0]==='k').forEach((f,j)=>S[f[1]]=orig?cp.defs[j]:R(PAL.cloth))}
 ['skin','iris','hcol','lip'].forEach(k=>S[k]=R(PAL[k]));S.bg=Math.random()<.25?'flag:'+R(FLAGS).id:R(PAL.bg.slice(0,8));render(true);ui()};

/* ===== BAIXAR PNG (720x900) — compõe as mesmas camadas num canvas ===== */
const load=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u});
/* ===== MARCA D'ÁGUA (canto inferior direito do PNG baixado) — ajuste aqui ===== */
const MARCA_IMG='/*MARCA*/';   // vem do arquivo marca.png (o build.py embute aqui)
const MARCA_LARGURA=0.20;      // largura da marca = 20% da largura do desenho (menor = mais discreta)
const MARCA_OPACIDADE=0.35;    // 0 = invisível, 1 = totalmente opaca
const MARCA_MARGEM=18;         // distância da borda direita/inferior, em pixels
/* compõe o personagem (camadas) num canvas W×H */
async function compor(W,H,semFundo){
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 for(const l of layers()){
  if(l[0]==='c'){const fl=flagOf(l[1]);if(!semFundo&&fl)drawFlag(x,fl,0,0,W,H);else if(!semFundo&&l[1]!=='transparent'){x.fillStyle=l[1];x.fillRect(0,0,W,H)}}
  else if(l[0]==='l'){x.drawImage(await load(l[1]),0,0,W,H);}
  else{const t=document.createElement('canvas');t.width=W;t.height=H;const y=t.getContext('2d');
   y.fillStyle=l[2];y.fillRect(0,0,W,H);y.globalCompositeOperation='destination-in';y.drawImage(await load(l[1]),0,0,W,H);x.drawImage(t,0,0);}
 }
 return c}
document.getElementById('dl').onclick=async()=>{
 const W=720,H=900,c=await compor(W,H),x=c.getContext('2d');
 try{const m=await load(MARCA_IMG),mw=W*MARCA_LARGURA,mh=mw*m.height/m.width;
  x.save();x.globalAlpha=MARCA_OPACIDADE;x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
  x.drawImage(m,W-mw-MARCA_MARGEM,H-mh-MARCA_MARGEM,mw,mh);x.restore()}catch(e){}
 const a=document.createElement('a');a.download='personagem-lordverso.png';a.href=c.toDataURL('image/png');a.click();
};

/* =====================================================================
   CARTA DO PERSONAGEM — imagem 1080×1920 (tamanho de story)
   Ajuste aqui: textos, cores e posições da carta.
   ===================================================================== */
const CARTA_PERFIL='@lordverso_oficial';   // seu @, aparece no rodapé da carta
const CARTA_TITULO='MEMBRO OFICIAL DO LORDVERSO';  // texto pequeno no topo
const CARTA_CHAMADA='Crie o seu no Lordverso';  // frase no rodapé
const CARTA_FUNDO='#1c1311', CARTA_DESTAQUE='#e0301e', CARTA_TEXTO='#fff3e6';
const FONTE="'Trebuchet MS',system-ui,sans-serif";
const CKEY='lv2carta';
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function ajusta(x,txt,max,larg,peso){let s=max;do{x.font=`${peso} ${s}px ${FONTE}`;s-=3}while(x.measureText(txt).width>larg&&s>30);return}
function limpaUser(v){v=(v||'').trim().replace(/^@+/,'').replace(/[^\w.]/g,'');return v?'@'+v:''}
async function desenhaCarta(cv){
 const W=1080,H=1920,x=cv.getContext('2d');
 const nome=(document.getElementById('cNome').value.trim()||'Sem nome').slice(0,22);
 const user=limpaUser(document.getElementById('cUser').value);
 /* fundo */
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a1c19');g.addColorStop(1,CARTA_FUNDO);
 x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle=CARTA_DESTAQUE;x.lineWidth=10;rr(x,30,30,W-60,H-60,56);x.stroke();
 x.strokeStyle='rgba(255,243,230,.18)';x.lineWidth=3;rr(x,52,52,W-104,H-104,40);x.stroke();
 /* título */
 x.textAlign='center';x.textBaseline='middle';x.fillStyle=CARTA_DESTAQUE;
 {let fs=40;do{x.font=`800 ${fs}px ${FONTE}`;if('letterSpacing' in x)x.letterSpacing=(fs/5)+'px';fs-=2}while(x.measureText(CARTA_TITULO).width>900&&fs>24)}   /* cabe na largura da carta */
 x.fillText(CARTA_TITULO,W/2,128);if('letterSpacing' in x)x.letterSpacing='0px';
 /* retrato (4:5), com cantos arredondados */
 const pw=900,ph=1125,px=(W-pw)/2,py=190;
 const per=await compor(1080,1350);
 x.save();rr(x,px,py,pw,ph,36);x.clip();
 const fl=flagOf(S.bg);if(fl)drawFlag(x,fl,px,py,pw,ph);else{const bg=S.bg==='transparent'?'#3a2823':S.bg;x.fillStyle=bg;x.fillRect(px,py,pw,ph)}
 x.drawImage(await compor(1080,1350,true),px,py,pw,ph);x.restore();
 x.strokeStyle=CARTA_TEXTO;x.lineWidth=8;rr(x,px,py,pw,ph,36);x.stroke();
 /* plaquinha com o nome */
 const ny=py+ph+40,nh=170;
 x.fillStyle=CARTA_DESTAQUE;rr(x,px,ny,pw,nh,32);x.fill();
 x.fillStyle=CARTA_TEXTO;ajusta(x,nome,110,pw-80,800);x.fillText(nome,W/2,ny+(user?66:nh/2));
 if(user){x.font=`600 44px ${FONTE}`;x.globalAlpha=.9;x.fillText(user,W/2,ny+132);x.globalAlpha=1}
 /* rodapé: logo + chamada + seu @ */
 const fy=ny+nh+50;
 try{const m=await load(MARCA_IMG),mw=330,mh=mw*m.height/m.width;x.drawImage(m,(W-mw)/2,fy,mw,mh);
  x.fillStyle=CARTA_TEXTO;x.globalAlpha=.8;x.font=`500 36px ${FONTE}`;x.fillText(CARTA_CHAMADA,W/2,fy+mh+34);x.globalAlpha=1;
  x.fillStyle=CARTA_DESTAQUE;x.font=`800 50px ${FONTE}`;x.fillText(CARTA_PERFIL,W/2,fy+mh+96);
 }catch(e){
  x.fillStyle=CARTA_TEXTO;x.font=`800 56px ${FONTE}`;x.fillText('LORDVERSO',W/2,fy+40);
  x.fillStyle=CARTA_DESTAQUE;x.font=`800 50px ${FONTE}`;x.fillText(CARTA_PERFIL,W/2,fy+110)}
}
const ov=document.getElementById('ov'),cv=document.getElementById('cv'),msg=document.getElementById('msg');
let cartaTimer=null;
const agenda=()=>{clearTimeout(cartaTimer);cartaTimer=setTimeout(()=>{desenhaCarta(cv);
 try{localStorage.setItem(CKEY,JSON.stringify({n:document.getElementById('cNome').value,u:document.getElementById('cUser').value}))}catch(e){}},150)};
document.getElementById('cartaBtn').onclick=()=>{
 try{const t=JSON.parse(localStorage.getItem(CKEY)||'null');if(t){document.getElementById('cNome').value=t.n||'';document.getElementById('cUser').value=t.u||''}}catch(e){}
 msg.textContent='';ov.classList.add('on');document.body.style.overflow='hidden';desenhaCarta(cv)};
const fecha=()=>{ov.classList.remove('on');document.body.style.overflow=''};
document.getElementById('fecha').onclick=fecha;
ov.addEventListener('click',e=>{if(e.target===ov)fecha()});
addEventListener('keydown',e=>{if(e.key==='Escape')fecha()});
document.getElementById('cNome').oninput=agenda;document.getElementById('cUser').oninput=agenda;
const blobCarta=()=>new Promise(r=>cv.toBlob(r,'image/png'));
const slug=()=>(document.getElementById('cNome').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'personagem');
document.getElementById('cBaixar').onclick=async()=>{
 await desenhaCarta(cv);const b=await blobCarta(),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='carta-'+slug()+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
 msg.textContent='Carta baixada! Poste no story e marque '+CARTA_PERFIL+' 💛'};
const bs=document.getElementById('cShare');
if(navigator.canShare&&navigator.share){bs.hidden=false;bs.onclick=async()=>{
 await desenhaCarta(cv);const b=await blobCarta(),f=new File([b],'carta-'+slug()+'.png',{type:'image/png'});
 if(!navigator.canShare({files:[f]})){msg.textContent='Seu navegador não consegue compartilhar a imagem. Use “Baixar carta”.';return}
 try{await navigator.share({files:[f],text:'Meu personagem feito no Lordverso! '+CARTA_PERFIL})}catch(e){}}}

addEventListener('resize',hh);
/* pré-carrega as imagens pra troca ser instantânea */
Object.values(D).forEach(cat=>Object.values(cat).forEach(p=>{if(p.line)img(p.line);if(p.back)img(p.back);if(p.mid)img(p.mid);if(p.porCabeca)Object.values(p.porCabeca).forEach(v=>{img(v.line);img(v.mid)});(p.fills||[]).forEach(f=>img(f[0]))}));
render(false);ui();hh();new ResizeObserver(hh).observe(document.getElementById('top'));
